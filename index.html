<style>
:root{
  --paper:#FAF8F3; --card:#FFFFFF; --ink:#141414; --dim:#6B6355;
  --rule:#E4DECF; --rule2:#F0EBE0;
  --neg:#0F5F6E; --negbg:#E4EFF2;
  --pos:#9A2B2B; --posbg:#F7E7E4;
  --band:#C9A227; --onband:#141414; --deep:#141414;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--band);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.hide{display:none !important}

/* ---------- shell ---------- */
#app{min-height:100vh;background:var(--paper);display:flex;flex-direction:column;overflow-x:hidden;max-width:100%}
.top{background:var(--band);color:var(--onband);padding:calc(env(safe-area-inset-top) + 12px) 14px 0;flex:none}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.title h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sync{font-size:10.5px;color:rgba(20,20,20,.68);display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:#14532D;flex:none}
.dot.off{background:#7F1D1D}
.dot.wait{background:#FFFFFF}

.datebar{display:flex;align-items:center;gap:6px;padding:10px 0 12px}
.arrow{background:rgba(20,20,20,.10);border:none;color:var(--onband);width:44px;height:44px;border-radius:10px;font-size:20px;cursor:pointer;flex:none}
.arrow:active{background:rgba(20,20,20,.22)}
.dlab{flex:1;text-align:center;font-size:15px;font-weight:600}
.dlab small{display:block;font-size:10px;font-weight:400;color:rgba(20,20,20,.62);letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.todaybtn{background:none;border:1px solid rgba(20,20,20,.3);color:var(--onband);font-size:10.5px;padding:6px 9px;border-radius:7px;cursor:pointer;flex:none;letter-spacing:.08em;text-transform:uppercase}

.tabs{display:flex;background:var(--band);padding:0 14px;flex:none}
.tab{flex:1;background:none;border:none;border-bottom:2.5px solid transparent;color:rgba(20,20,20,.55);padding:14px 4px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:inherit}
.tab.on{color:var(--onband);border-bottom-color:var(--onband)}

.body{padding:14px;flex:1;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}

/* ---------- table ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:#F3EFE2;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:9px 7px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
table.t th.l,table.t td.l{text-align:left}
table.t td{padding:11px 7px;border-bottom:1px solid var(--rule2);white-space:nowrap;vertical-align:middle}
table.t td.vol{font-size:14px;color:#3E4D46}
table.t td.cum{font-size:15px;font-weight:700}
.psub{font-size:11px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
table.t td.stick{max-width:150px;min-width:96px}
.pname,.psub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.t tr:last-child td{border-bottom:none}
table.t .stick{position:sticky;left:0;z-index:2;background:var(--card);box-shadow:1px 0 0 var(--rule)}
table.t th.stick{z-index:3;background:#F3EFE2}
table.t tbody tr:active td{background:#FBF6E8}
table.t tbody tr:active td.stick{background:#FBF6E8}
.bed{font-size:10px;color:var(--dim);letter-spacing:.06em}
.pname{font-weight:600;font-size:13.5px;line-height:1.2}
.blank{color:#B7C2BB}
.bal{display:inline-block;padding:4px 8px;border-radius:6px;font-weight:700;font-size:15px}
.bal.n{background:var(--negbg);color:var(--neg)}
.bal.p{background:var(--posbg);color:var(--pos)}
.bal.z{background:#EEF0EE;color:var(--dim)}
.spine{width:96px;height:22px;position:relative}
.spine i{position:absolute;top:0;bottom:0;width:1px;left:50%;background:var(--rule)}
.spine b{position:absolute;top:5px;height:12px;border-radius:2px}

/* ---------- pieces ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.04em}
.row{display:flex;gap:8px;margin-bottom:9px}
.row>.btn{flex:1 1 0;width:auto;min-width:0}
.row.end{justify-content:flex-end}
.row>.btn.auto{flex:0 1 auto;width:auto}
.f{flex:1;min-width:0}
.f label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:5px;text-align:center}
.f label.l{text-align:left}
.f input{width:100%;padding:14px 12px;min-height:54px;border:1px solid var(--rule);border-radius:10px;font-size:19px;font-weight:600;background:#FCFDFC;color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;-webkit-appearance:none}
.f input[inputmode="numeric"],.f input[inputmode="decimal"]{text-align:center;letter-spacing:.02em}
.f input::placeholder{font-weight:400;color:#C3CCC6}
.f input.txt{font-family:inherit}
.f input:focus{outline:2px solid var(--neg);outline-offset:-1px;border-color:var(--neg)}
.btn{width:100%;padding:16px 13px;min-height:54px;border:none;border-radius:10px;background:var(--deep);color:#fff;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:inherit}
.btn:active{opacity:.82}
.btn:disabled{background:#B6C2BA;cursor:default}
.btn.ghost{background:none;color:var(--deep);border:1px solid var(--rule);font-weight:600}
.btn.danger{background:var(--pos);color:#fff;border:none}
.btn.ghost.danger{background:none;color:var(--pos);border:1px solid #E4C4C0}
.btn.sm{padding:12px 9px;min-height:46px;font-size:12px}
.addrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.add{background:var(--deep);color:#fff;border:none;border-radius:24px;padding:12px 18px 12px 14px;font-size:13px;font-weight:700;letter-spacing:.05em;cursor:pointer;display:flex;align-items:center;gap:7px;flex:none;font-family:inherit;min-height:46px}
.add span{font-size:17px;line-height:1;font-weight:400;margin-top:-1px}
.pill{display:inline-block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:20px;background:#F3EFE2;color:var(--dim);font-weight:700}
.pill.out{background:#F3EEE8;color:#8A6A3E}
.empty{text-align:center;padding:36px 20px;color:var(--dim);font-size:13.5px;line-height:1.55}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.note{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:8px}
.err{background:#F8E7E4;border:1px solid #E4C4C0;color:var(--pos);padding:10px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px;line-height:1.45}
.ok{background:#E4F1F4;border:1px solid #B9DAE2;color:var(--neg);padding:10px 12px;border-radius:9px;font-size:12.5px;line-height:1.45;margin-bottom:12px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mini>div{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:11px 12px}
.mini span{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:3px}
.mini b{font-size:21px;font-weight:700}

/* ---------- entry list ---------- */
.elist{margin-bottom:12px}
.eitem{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:13px 12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;min-height:58px}
.eitem:active{background:#FBF6E8}
.eitem.on{border-color:var(--neg);outline:1px solid var(--neg)}
.etime{font-size:13px;color:var(--dim);font-weight:700;flex:none;width:50px;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.evals{flex:1;min-width:0;font-size:14.5px;line-height:1.35}
.evals em{font-style:normal;color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-right:3px}
.eby{font-size:10.5px;color:var(--dim);margin-top:2px}
.echev{color:#B7C2BB;font-size:15px;flex:none}
.daybar{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 8px}
.daybar b{font-size:12px}


/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;background:rgba(20,30,26,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 26px)}
.sheet h2{margin:0 0 2px;font-size:17px}
.sheet .sub{font-size:11.5px;color:var(--dim);margin-bottom:14px}

/* ---------- login ---------- */
#login,#recover{min-height:100vh;background:var(--band);display:flex;flex-direction:column;justify-content:center;padding:26px 20px calc(env(safe-area-inset-bottom) + 26px);color:var(--onband)}
#login h1,#recover h1{margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
#login p.lead,#recover p.lead{margin:0 0 26px;font-size:12.5px;color:rgba(20,20,20,.72);line-height:1.5}
#login label,#recover label{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(20,20,20,.72);font-weight:700;margin-bottom:5px}
#login input,#recover input{width:100%;padding:13px 12px;border:1px solid rgba(20,20,20,.22);border-radius:9px;font-size:16px;background:rgba(255,255,255,.85);color:#141414;margin-bottom:13px;font-family:inherit}
#login input:focus,#recover input:focus{outline:2px solid #141414;outline-offset:-1px}
#login button,#recover button{width:100%;padding:14px;border:none;border-radius:9px;background:#141414;color:#F3D98A;font-size:13.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:inherit}
#login button:disabled{opacity:.5}
#login .msg,#recover .msg{font-size:12.5px;line-height:1.45;margin-bottom:14px;padding:10px 12px;border-radius:8px}
#login .msg.bad,#recover .msg.bad{background:rgba(127,29,29,.14);color:#6E1515;border:1px solid rgba(127,29,29,.3)}
#login .brandmark{display:block;width:104px;height:104px;border-radius:23%;margin:0 0 26px;
  box-shadow:0 2px 14px rgba(20,20,20,.22)}

.gbtn{width:100%;padding:14px;border:1px solid rgba(20,20,20,.3);border-radius:9px;background:rgba(255,255,255,.55);
  color:#141414;font-size:13.5px;font-weight:600;letter-spacing:.04em;cursor:pointer;font-family:inherit;min-height:52px}
.gbtn:active{background:rgba(255,255,255,.85)}
.linkbtn{display:block;width:100%;background:none;border:none;color:rgba(20,20,20,.75);font-size:12.5px;padding:12px 0 2px;
  cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:3px}
.orline{display:flex;align-items:center;gap:12px;margin:16px 0 14px;color:rgba(20,20,20,.55);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:rgba(20,20,20,.2)}
.ver{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(20,20,20,.55);margin-top:18px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 22px);left:50%;transform:translateX(-50%);background:#141414;color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;letter-spacing:.06em;z-index:60}
/* ---------- phone ---------- */
.sheet>div{max-height:94vh}
.sheetact{position:sticky;bottom:0;z-index:5;padding:14px 0 2px;margin-top:2px;
  background:linear-gradient(to bottom,rgba(246,248,246,0),var(--paper) 24%)}
.f input[disabled]{background:#F1F4F1}

@media (max-width:440px){
  .body{padding:12px}
  .spinecell{display:none}
  table.t td{padding:11px 6px}
  table.t th{padding:9px 6px}
  .sheet>div{padding-left:12px;padding-right:12px}
  .card{padding:12px}
  .row{gap:7px}
}

@media (max-width:400px){
  table.t td{padding:11px 5px}
  table.t th{padding:9px 5px}
  table.t td.stick{max-width:112px}
  table.t td.vol{font-size:13px}
  .bal{font-size:14px;padding:4px 6px}
  .pname{font-size:13px}
  .psub{font-size:10.5px}
}

@media (prefers-reduced-motion:no-preference){
  .fade{animation:f .18s ease-out}
  @keyframes f{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
}
</style>
</head>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

/* ==================================================================
   Settings live in config.js, next to this file.
   Nothing in here needs editing when you update the app.
   ================================================================== */

const VERSION = "2.4";

let recovering = false;

const CFG = window.WARD_CONFIG || {};
const SUPABASE_URL      = CFG.url || "";
const SUPABASE_ANON_KEY = CFG.key || "";

/* The charting day runs 08:00 to 08:00. An entry recorded at 06:00 on
   the 6th belongs to the charting day of the 5th. */
const DAY_START_HOUR = 8;

const CONFIGURED = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;
const sb = CONFIGURED ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ---------------- helpers ---------------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const isoOf = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

/* which charting day does this moment fall in */
const chartDayOf = (d) => { const x = new Date(d.getTime()); x.setHours(x.getHours() - DAY_START_HOUR); return isoOf(x); };
const currentChartDay = () => chartDayOf(new Date());

const fmtDMY = (iso) => { if(!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}-${m}-${y}`; };
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtLong = (iso) => { const [y,m,d] = iso.split('-').map(Number); return `${DAYS[new Date(y,m-1,d).getDay()]} ${d} ${MONS[m-1]}`; };
const shiftDate = (iso,n) => { const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return isoOf(dt); };
const fmtTime = (ts) => { const d = new Date(ts); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

const numOrNull = (v) => { if(v===''||v===null||v===undefined) return null; const n=Number(v); return Number.isFinite(n)?n:null; };
const signed = (n) => n>0 ? `+${n}` : `${n}`;

/* ---------------- state ---------------- */
const S = {
  session: null,
  email: '',
  date: currentChartDay(),
  tab: 'chart',
  patients: [],
  entries: {},          // patientId -> [entry, ...] sorted by time
  loading: true,
  live: false,
  err: '',
  editing: null,        // entry id being edited inside the sheet
  openPid: null,        // patient whose sheet is open
};

const toast = (m) => {
  $('toast').innerHTML = `<div class="toast">${esc(m)}</div>`;
  setTimeout(()=>{ $('toast').innerHTML=''; }, 1800);
};

/* ---------------- aggregation ---------------- */

const entriesFor = (pid, day) =>
  (S.entries[pid] || []).filter(e => e.chart_day === day).sort((a,b) => a.at.localeCompare(b.at));

/* summed intake / output for one charting day */
function dayTotals(pid, day){
  const list = entriesFor(pid, day);
  let intake = null, output = null, bp = null, weight = null;
  for(const e of list){
    if(e.intake !== null) intake = (intake || 0) + e.intake;
    if(e.output !== null) output = (output || 0) + e.output;
    if(e.sys !== null && e.dia !== null) bp = e;      // latest wins
    if(e.weight !== null) weight = e.weight;
  }
  const balance = (intake === null && output === null) ? null : (intake||0) - (output||0);
  return { intake, output, balance, bp, weight, count: list.length };
}

/* running total from admission through this charting day */
function cumulativeTo(pid, day){
  const days = new Set((S.entries[pid] || []).map(e => e.chart_day));
  let total = null;
  for(const d of [...days].sort()){
    if(d > day) continue;
    const b = dayTotals(pid, d).balance;
    if(b !== null) total = (total || 0) + b;
  }
  return total;
}

/* ---------------- data ---------------- */
async function fetchAll(){
  const [p, e] = await Promise.all([
    sb.from('patients').select('*'),
    sb.from('entries').select('*').order('at', { ascending: true }),
  ]);
  if(p.error || e.error){ S.err = (p.error || e.error).message; render(); return; }
  S.err = '';
  S.patients = (p.data || []).sort(sortPt);
  const map = {};
  for(const row of (e.data || [])) (map[row.patient_id] ||= []).push(row);
  S.entries = map;
  S.loading = false;
  render();
  if(S.openPid) paintSheet();
}

function sortPt(a,b){
  if(a.active !== b.active) return a.active ? -1 : 1;
  const ab=(a.bed||'').padStart(6,'0'), bb=(b.bed||'').padStart(6,'0');
  return ab.localeCompare(bb) || (a.name||'').localeCompare(b.name||'');
}

function localAdd(row){
  const list = (S.entries[row.patient_id] ||= []);
  const i = list.findIndex(x => x.id === row.id);
  if(i >= 0) list[i] = row; else list.push(row);
  list.sort((a,b) => a.at.localeCompare(b.at));
}

async function addEntry(pid, day, vals){
  const row = {
    patient_id: pid,
    chart_day: day,
    at: new Date().toISOString(),
    sys: numOrNull(vals.sys), dia: numOrNull(vals.dia),
    intake: numOrNull(vals.intake), output: numOrNull(vals.output),
    weight: numOrNull(vals.weight),
    entered_by: S.email,
  };
  if(['sys','dia','intake','output','weight'].every(k => row[k] === null)){
    toast('Nothing to save'); return false;
  }
  const { data, error } = await sb.from('entries').insert(row).select().single();
  if(error){ toast(error.message); return false; }
  localAdd(data);
  render(); paintSheet();
  return true;
}

async function updateEntry(id, vals){
  const patch = {
    sys: numOrNull(vals.sys), dia: numOrNull(vals.dia),
    intake: numOrNull(vals.intake), output: numOrNull(vals.output),
    weight: numOrNull(vals.weight),
    edited_by: S.email, edited_at: new Date().toISOString(),
  };
  if(['sys','dia','intake','output','weight'].every(k => patch[k] === null)){
    toast('Nothing left — delete it instead'); return false;
  }
  const { data, error } = await sb.from('entries').update(patch).eq('id', id).select().single();
  if(error){ toast(error.message); return false; }
  localAdd(data);
  S.editing = null;
  render(); paintSheet();
  return true;
}

async function deleteEntry(id, pid){
  const { error } = await sb.from('entries').delete().eq('id', id);
  if(error){ toast(error.message); return false; }
  S.entries[pid] = (S.entries[pid] || []).filter(e => e.id !== id);
  S.editing = null;
  render(); paintSheet();
  return true;
}

async function savePatient(p){
  const { data, error } = await sb.from('patients').upsert(p).select().single();
  if(error){ toast(error.message); return null; }
  const i = S.patients.findIndex(x => x.id === data.id);
  if(i >= 0) S.patients[i] = data; else S.patients.push(data);
  S.patients.sort(sortPt);
  render();
  return data;
}

async function deletePatient(pid){
  const { error } = await sb.from('patients').delete().eq('id', pid);
  if(error){ toast(error.message); return false; }
  S.patients = S.patients.filter(p => p.id !== pid);
  delete S.entries[pid];
  render();
  return true;
}

/* ---------------- auth ---------------- */
async function doSignIn(){
  const email = $('em').value.trim(), pw = $('pw').value;
  if(!email || !pw){ loginMsg('Enter your email and password.','bad'); return; }
  $('signin').disabled = true; $('signin').textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  $('signin').disabled = false; $('signin').textContent = 'Sign in';
  if(error) loginMsg(error.message, 'bad');
}

function loginMsg(t, kind){
  $('loginMsg').innerHTML = t ? `<div class="msg ${kind||''}">${esc(t)}</div>` : '';
}

function recMsg(t, kind){
  $('recMsg').innerHTML = t ? `<div class="msg ${kind||''}">${esc(t)}</div>` : '';
}

async function doGoogle(){
  const b = $('google'); b.disabled = true; b.textContent = 'Opening Google…';
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin }
  });
  if(error){
    b.disabled = false; b.textContent = 'Continue with Google';
    loginMsg(/provider/i.test(error.message)
      ? 'Google sign-in is not switched on for this app yet.'
      : error.message, 'bad');
  }
}

async function doForgot(){
  const email = $('em').value.trim();
  if(!email){ loginMsg('Type your email address above first, then tap this again.', 'bad'); $('em').focus(); return; }
  const b = $('forgot'); b.disabled = true; b.textContent = 'Sending…';
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
  b.disabled = false; b.textContent = 'Forgot your password?';
  if(error) loginMsg(error.message, 'bad');
  else loginMsg('If that address has an account, a reset link is on its way. Open it on this device.', '');
}

function showRecovery(){
  $('login').classList.add('hide');
  $('app').classList.add('hide');
  $('recover').classList.remove('hide');
  recMsg('');
  $('np').focus();
}

async function changePasswordInApp(){
  const a = $('p_new').value, b = $('p_new2').value;
  if(a.length < 8){ toast('Use at least 8 characters'); return; }
  if(a !== b){ toast('The two do not match'); return; }
  const { error } = await sb.auth.updateUser({ password: a });
  if(error){ toast(error.message); return; }
  $('p_new').value = ''; $('p_new2').value = '';
  toast('Password changed');
}

async function setNewPassword(){
  const a = $('np').value, b2 = $('np2').value;
  if(a.length < 8){ recMsg('Use at least 8 characters.', 'bad'); return; }
  if(a !== b2){ recMsg('The two passwords do not match.', 'bad'); return; }
  const btn = $('setpw'); btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await sb.auth.updateUser({ password: a });
  btn.disabled = false; btn.textContent = 'Save password';
  if(error){ recMsg(error.message, 'bad'); return; }
  recovering = false;
  $('recover').classList.add('hide');
  const { data } = await sb.auth.getSession();
  applySession(data.session);
  toast('Password changed');
}

async function boot(){
  const vl = $('verLogin'); if(vl) vl.textContent = `Version ${VERSION}`;
  if(!CONFIGURED){
    document.body.innerHTML = `<div id="login"><h1>Ward Balance</h1>
      <p class="lead">Settings not found. There should be a file called <b>config.js</b> sitting next to
      index.html, holding your Supabase project URL and anon public key.</p></div>`;
    $('login').classList.remove('hide');
    return;
  }
  // a recovery link lands back here with #type=recovery in the URL
  if(/type=recovery/.test(window.location.hash)) recovering = true;

  const { data } = await sb.auth.getSession();
  if(recovering && data.session){ showRecovery(); }
  else applySession(data.session);

  sb.auth.onAuthStateChange((e, s) => {
    if(e === 'PASSWORD_RECOVERY'){ recovering = true; showRecovery(); return; }
    if(recovering) return;        // stay on the set-password screen
    applySession(s);
  });
}

function applySession(session){
  S.session = session;
  $('recover').classList.add('hide');
  if(session){
    S.email = session.user.email;
    $('login').classList.add('hide');
    $('app').classList.remove('hide');
    fetchAll();
    subscribe();
  } else {
    $('app').classList.add('hide');
    $('login').classList.remove('hide');
    loginMsg('');
  }
}

let channel = null;
function subscribe(){
  if(channel) return;
  channel = sb.channel('ward')
    .on('postgres_changes', { event:'*', schema:'public', table:'patients' }, fetchAll)
    .on('postgres_changes', { event:'*', schema:'public', table:'entries' },  fetchAll)
    .subscribe((status) => { S.live = status === 'SUBSCRIBED'; paintSync(); });
}

function paintSync(){
  $('dot').className = 'dot' + (S.err ? ' off' : S.live ? '' : ' wait');
  $('syncTxt').textContent = S.err ? 'error' : S.live ? 'live' : 'connecting';
}

/* ---------------- render ---------------- */

  $('dayShort').textContent = `${fmtDMY(S.date)} · 08:00 → 08:00`;

function spine(value, scale){
  if(value === null || !scale) return `<div class="spine"><i></i></div>`;
  const frac = Math.min(Math.abs(value)/scale, 1);
  const w = Math.max(frac*47, value === 0 ? 0 : 2);
  const neg = value < 0;
  return `<div class="spine"><i></i><b style="background:var(--${neg?'neg':'pos'});${neg?'right:50%':'left:50%'};width:${w}%"></b></div>`;
}

const bpPlain = (t) => t.bp ? `${t.bp.sys}/${t.bp.dia}` : null;

const shownPatients = () => S.patients.filter(p => p.active && p.admitted <= S.date);

function viewChart(){
  const list = shownPatients();
  const head = `<div class="addrow">
      <span class="eyebrow">${list.length} patient${list.length===1?'':'s'} in ward</span>
      <button class="add" data-act="admit"><span>+</span> Add patient</button>
    </div>`;

  if(S.loading) return head + `<div class="empty">Loading the ward…</div>`;
  if(!list.length) return head + `<div class="empty"><strong>No patients yet</strong>
    Tap <b>+ Add patient</b> above to admit someone. Their chart starts from the admission date you set.</div>`;

  const scale = Math.max(500, ...list.map(p => Math.abs(dayTotals(p.id, S.date).balance ?? 0)));

  const rows = list.map(p => {
    const t = dayTotals(p.id, S.date);
    const c = cumulativeTo(p.id, S.date);
    const cc = c===null ? '' : (c<0 ? 'var(--neg)' : c>0 ? 'var(--pos)' : '');
    const sub = [bpPlain(t), t.count > 1 ? `${t.count} entries` : null].filter(Boolean).join(' · ');
    return `<tr data-open="${p.id}">
      <td class="l stick">${p.bed?`<div class="bed mono">BED ${esc(p.bed)}</div>`:''}<div class="pname">${esc(p.name)}</div>${sub?`<div class="psub mono">${sub}</div>`:''}</td>
      <td class="mono vol">${t.intake!==null?t.intake:'<span class="blank">—</span>'}</td>
      <td class="mono vol">${t.output!==null?t.output:'<span class="blank">—</span>'}</td>
      <td class="mono">${t.balance===null?'<span class="blank">—</span>':`<span class="bal ${t.balance<0?'n':t.balance>0?'p':'z'}">${signed(t.balance)}</span>`}</td>
      <td class="spinecell">${spine(t.balance, scale)}</td>
      <td class="mono cum" style="color:${cc}">${c===null?'<span class="blank">—</span>':signed(c)}</td>
    </tr>`;
  }).join('');

  return head + `<div class="scroll"><table class="t">
      <thead><tr>
        <th class="l stick">Patient</th><th>In</th><th>Out</th><th>24 h</th><th class="l spinecell"></th><th>Cum</th>
      </tr></thead><tbody>${rows}</tbody></table></div>
    <div class="note">All volumes in ml, totalled across every entry made in this 08:00 to 08:00 window.
      Tap a row to add an entry or review the day's readings. Blue is negative balance, red is positive.</div>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost sm" data-act="refresh">Refresh</button>
      <button class="btn ghost sm" data-act="copy">Copy day as text</button>
    </div>`;
}

/* ---------------- entry sheet ---------------- */
function closeSheet(){ S.openPid = null; S.editing = null; $('sheets').innerHTML = ''; }

function openEntry(pid){
  S.openPid = pid; S.editing = null;
  $('sheets').innerHTML = `<div class="sheet" data-close="1"><div id="sheetBody"></div></div>`;
  paintSheet();
}

function entryLine(e){
  const bits = [];
  if(e.sys !== null && e.dia !== null) bits.push(`<em>BP</em>${e.sys}/${e.dia}`);
  if(e.intake !== null) bits.push(`<em>In</em>${e.intake}`);
  if(e.output !== null) bits.push(`<em>Out</em>${e.output}`);
  if(e.weight !== null) bits.push(`<em>Wt</em>${e.weight}`);
  return bits.join('&nbsp;&nbsp;');
}

function paintSheet(){
  const body = $('sheetBody'); if(!body || !S.openPid) return;
  const pid = S.openPid;
  const p = S.patients.find(x => x.id === pid);
  if(!p){ closeSheet(); return; }

  const list = entriesFor(pid, S.date);
  const t = dayTotals(pid, S.date);
  const c = cumulativeTo(pid, S.date);
  const ed = S.editing ? list.find(e => e.id === S.editing) : null;

  const items = list.length ? list.map(e => `
    <div class="eitem ${S.editing===e.id?'on':''}" data-entry="${e.id}">
      <div class="etime">${fmtTime(e.at)}</div>
      <div class="evals">${entryLine(e)}
        <div class="eby">${esc(e.entered_by||'')}${e.edited_by?` · edited by ${esc(e.edited_by)}`:''}</div>
      </div>
      <div class="echev">${S.editing===e.id?'▾':'›'}</div>
    </div>`).join('')
    : `<div class="note" style="margin-bottom:12px">Nothing recorded for this day yet.</div>`;

  const f = (k) => ed && ed[k] !== null && ed[k] !== undefined ? ed[k] : '';

  body.innerHTML = `
    <h2>${esc(p.name)}</h2>
    <div class="sub">${p.bed?`Bed ${esc(p.bed)} · `:''}Admitted ${fmtDMY(p.admitted)} · ${fmtDMY(S.date)}, 08:00 → 08:00</div>

    <div class="mini">
      <div><span>Intake</span><b class="mono">${t.intake ?? '—'}</b></div>
      <div><span>Output</span><b class="mono">${t.output ?? '—'}</b></div>
      <div><span>Balance</span><b class="mono" style="color:${t.balance===null?'':t.balance<0?'var(--neg)':t.balance>0?'var(--pos)':''}">${t.balance===null?'—':signed(t.balance)}</b></div>
      <div><span>Cumulative</span><b class="mono" style="color:${c===null?'':c<0?'var(--neg)':c>0?'var(--pos)':''}">${c===null?'—':signed(c)}</b></div>
    </div>

    <div class="daybar"><span class="eyebrow">Entries today</span><b class="mono" style="color:var(--dim)">${list.length}</b></div>
    <div class="elist">${items}</div>

    <div class="card">
      <h3>${ed ? `Edit the ${fmtTime(ed.at)} entry` : 'Add an entry'}</h3>
      <div class="row">
        <div class="f"><label>Systolic</label><input id="i_sys" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${f('sys')}" placeholder="—"></div>
        <div class="f"><label>Diastolic</label><input id="i_dia" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${f('dia')}" placeholder="—"></div>
      </div>
      <div class="row">
        <div class="f"><label>Intake ml</label><input id="i_in" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${f('intake')}" placeholder="—"></div>
        <div class="f"><label>Output ml</label><input id="i_out" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${f('output')}" placeholder="—"></div>
      </div>
      <div class="row" style="margin-bottom:0">
        <div class="f"><label>Weight kg</label><input id="i_wt" type="text" inputmode="decimal" pattern="[0-9.]*" autocomplete="off" value="${f('weight')}" placeholder="—"></div>
        <div class="f"><label>Time</label><input value="${ed ? fmtTime(ed.at) : 'now'}" disabled style="opacity:.6"></div>
      </div>
      <div class="note">${ed ? 'The original time is kept. Your name is recorded against the change.' : 'Fill only what you have. The time is stamped automatically and this adds to the day, it does not replace earlier entries.'}</div>
    </div>

    <div class="sheetact">${ed
      ? `<button class="btn" id="doSave">Save changes</button>
         <div class="row" style="margin-top:9px;margin-bottom:0">
           <button class="btn ghost sm" id="cancelEdit">Cancel</button>
           <button class="btn ghost sm danger" id="doDelEntry">Delete entry</button>
         </div>`
      : `<button class="btn" id="doAdd">Add entry</button>
         <div class="row" style="margin-top:9px;margin-bottom:0">
           <button class="btn ghost sm" data-hist="${pid}">Full chart</button>
           <button class="btn ghost sm" data-close="1">Close</button>
         </div>`}</div>
  `;

  body.querySelectorAll('[data-entry]').forEach(el => el.onclick = () => {
    S.editing = S.editing === el.dataset.entry ? null : el.dataset.entry;
    paintSheet();
  });

  // type=text is what gives iOS the big keypad, so keep the fields numeric ourselves
  ['i_sys','i_dia','i_in','i_out'].forEach(id => {
    const el = $(id); if(!el) return;
    el.addEventListener('input', () => {
      const v = el.value.replace(/[^0-9]/g,'');
      if(v !== el.value) el.value = v;
    });
  });
  const wtEl = $('i_wt');
  if(wtEl) wtEl.addEventListener('input', () => {
    let v = wtEl.value.replace(/[^0-9.]/g,'');
    const i = v.indexOf('.');
    if(i !== -1) v = v.slice(0, i+1) + v.slice(i+1).replace(/\./g,'');
    if(v !== wtEl.value) wtEl.value = v;
  });

  const read = () => ({ sys:$('i_sys').value, dia:$('i_dia').value, intake:$('i_in').value, output:$('i_out').value, weight:$('i_wt').value });

  if($('doAdd')) $('doAdd').onclick = async () => {
    const b = $('doAdd'); b.disabled = true; b.textContent = 'Saving…';
    const ok = await addEntry(pid, S.date, read());
    if(ok) toast('Entry added');
    else { b.disabled = false; b.textContent = 'Add entry'; }
  };
  if($('doSave')) $('doSave').onclick = async () => {
    const b = $('doSave'); b.disabled = true; b.textContent = 'Saving…';
    const ok = await updateEntry(S.editing, read());
    if(ok) toast('Updated');
    else { b.disabled = false; b.textContent = 'Save changes'; }
  };
  if($('cancelEdit')) $('cancelEdit').onclick = () => { S.editing = null; paintSheet(); };
  if($('doDelEntry')) $('doDelEntry').onclick = async () => {
    const ok = await deleteEntry(S.editing, pid);
    if(ok) toast('Entry deleted');
  };
}

/* ---------------- history ---------------- */
function openHistory(pid){
  const p = S.patients.find(x => x.id === pid); if(!p) return;
  S.openPid = null;
  const days = [...new Set((S.entries[pid]||[]).map(e => e.chart_day))].sort();
  let run = null;

  const rows = days.map(d => {
    const t = dayTotals(pid, d);
    if(t.balance !== null) run = (run||0) + t.balance;
    const cc = run===null ? '' : (run<0?'var(--neg)':run>0?'var(--pos)':'');
    return `<tr>
      <td class="l stick mono" style="font-size:12px">${fmtDMY(d)}</td>
      <td class="mono">${t.bp?`${t.bp.sys}/${t.bp.dia}`:'<span class="blank">—</span>'}</td>
      <td class="mono">${t.weight ?? '<span class="blank">—</span>'}</td>
      <td class="mono">${t.intake ?? '<span class="blank">—</span>'}</td>
      <td class="mono">${t.output ?? '<span class="blank">—</span>'}</td>
      <td class="mono">${t.balance===null?'<span class="blank">—</span>':`<span class="bal ${t.balance<0?'n':t.balance>0?'p':'z'}">${signed(t.balance)}</span>`}</td>
      <td class="mono" style="font-weight:700;color:${cc}">${run===null?'<span class="blank">—</span>':signed(run)}</td>
      <td class="mono" style="font-size:11px;color:var(--dim)">${t.count}</td>
    </tr>`;
  }).join('');

  $('sheets').innerHTML = `<div class="sheet" data-close="1"><div>
    <h2>${esc(p.name)}</h2>
    <div class="sub">${p.bed?`Bed ${esc(p.bed)} · `:''}Admitted ${fmtDMY(p.admitted)} · ${days.length} charted day${days.length===1?'':'s'}</div>
    ${days.length ? `<div class="scroll"><table class="t"><thead><tr>
        <th class="l stick">Day</th><th>BP</th><th>Wt</th><th>In</th><th>Out</th><th>24 h</th><th>Cumulative</th><th>Entries</th>
      </tr></thead><tbody>${rows}</tbody></table></div>
      <div class="note">Each row totals every entry made in that 08:00 to 08:00 window.</div>`
      : `<div class="empty"><strong>Nothing charted yet</strong>Entries will appear here once they are made.</div>`}
    <button class="btn ghost" style="margin-top:12px" data-close="1">Close</button>
  </div></div>`;
}

/* ---------------- delete patient ---------------- */
function openDelete(pid){
  const p = S.patients.find(x => x.id === pid); if(!p) return;
  const n = (S.entries[pid]||[]).length;

  $('sheets').innerHTML = `<div class="sheet" data-close="1"><div>
    <h2>Delete ${esc(p.name)}?</h2>
    <div class="sub">This removes the patient and all ${n} entr${n===1?'y':'ies'} for good. It cannot be undone.</div>
    <div class="card">
      <div class="note" style="margin-top:0">If you only want them off the daily chart, close this and use
      <b>Discharge</b> instead — that keeps the record.</div>
      <div class="f" style="margin-top:12px">
        <label class="l">Type the patient's name to confirm</label>
        <input class="txt" id="d_confirm" placeholder="${esc(p.name)}" autocapitalize="off" spellcheck="false">
      </div>
    </div>
    <button class="btn danger" id="doDelete" disabled>Delete permanently</button>
    <button class="btn ghost" style="margin-top:9px" data-close="1">Cancel</button>
  </div></div>`;

  const inp = $('d_confirm'), btn = $('doDelete');
  inp.focus();
  inp.addEventListener('input', () => {
    btn.disabled = inp.value.trim().toLowerCase() !== p.name.trim().toLowerCase();
  });
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'Deleting…';
    const ok = await deletePatient(pid);
    if(ok){ closeSheet(); toast('Deleted'); }
    else { btn.disabled = false; btn.textContent = 'Delete permanently'; }
  };
}

/* ---------------- admit ---------------- */
function openAdmit(){
  $('sheets').innerHTML = `<div class="sheet" data-close="1"><div>
    <h2>Admit a patient</h2>
    <div class="sub">The cumulative balance is counted from the admission date.</div>
    <div class="card">
      <div class="row">
        <div class="f" style="flex:2"><label class="l">Name or identifier</label><input class="txt" id="a_name" placeholder="e.g. Anita S."></div>
        <div class="f"><label class="l">Bed</label><input class="txt" id="a_bed" placeholder="838"></div>
      </div>
      <div class="row" style="margin-bottom:0">
        <div class="f"><label class="l">Admission date</label><input id="a_date" type="date" value="${currentChartDay()}"></div>
      </div>
    </div>
    <button class="btn" id="doAdmit">Admit</button>
    <button class="btn ghost" style="margin-top:9px" data-close="1">Cancel</button>
  </div></div>`;

  $('a_name').focus();
  $('doAdmit').onclick = async () => {
    const name = $('a_name').value.trim();
    if(!name){ $('a_name').focus(); return; }
    const btn = $('doAdmit'); btn.disabled = true; btn.textContent = 'Admitting…';
    const p = await savePatient({
      name, bed: $('a_bed').value.trim() || null,
      admitted: $('a_date').value || currentChartDay(),
      active: true, created_by: S.email,
    });
    if(p){ closeSheet(); toast('Admitted'); }
    else { btn.disabled = false; btn.textContent = 'Admit'; }
  };
}

function copyDay(){
  const lines = [`Ward fluid balance — ${fmtDMY(S.date)} (08:00 to 08:00)`, ''];
  for(const p of shownPatients()){
    const t = dayTotals(p.id, S.date), c = cumulativeTo(p.id, S.date);
    lines.push(
      `${p.bed ? p.bed+' · ' : ''}${p.name}`,
      `  BP ${t.bp?`${t.bp.sys}/${t.bp.dia}`:'—'} | In ${t.intake ?? '—'} | Out ${t.output ?? '—'}`,
      `  24h ${t.balance===null?'—':signed(t.balance)+' ml'} | Cum ${c===null?'—':signed(c)+' ml'}`,
      ''
    );
  }
  const txt = lines.join('\n');
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast('Copied'), ()=>toast('Copy failed'));
}

/* ---------------- events ---------------- */
function wire(){
  $('view').querySelectorAll('[data-open]').forEach(el => el.onclick = () => openEntry(el.dataset.open));
  $('view').querySelectorAll('[data-hist]').forEach(el => el.onclick = (e) => { e.stopPropagation(); openHistory(el.dataset.hist); });
  $('view').querySelectorAll('[data-del]').forEach(el => el.onclick = (e) => { e.stopPropagation(); openDelete(el.dataset.del); });
  $('view').querySelectorAll('[data-toggle]').forEach(el => el.onclick = async () => {
    const p = S.patients.find(x => x.id === el.dataset.toggle);
    if(p) await savePatient({ ...p, active: !p.active });
  });
  $('view').querySelectorAll('[data-act]').forEach(el => el.onclick = async () => {
    const a = el.dataset.act;
    if(a === 'admit')   openAdmit();
    if(a === 'refresh') { await fetchAll(); toast('Refreshed'); }
    if(a === 'copy')    copyDay();
    if(a === 'signout') { await sb.auth.signOut(); channel = null; }
    if(a === 'setpw')   await changePasswordInApp();
  });
}

document.addEventListener('click', (e) => {
  if(e.target.classList && e.target.classList.contains('sheet')){ closeSheet(); return; }
  if(e.target.closest('button[data-close]')){ closeSheet(); return; }
  const h = e.target.closest('[data-hist]');
  if(h && $('sheets').contains(h)) openHistory(h.dataset.hist);
});

document.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
$('prev').onclick     = () => { S.date = shiftDate(S.date,-1); render(); if(S.openPid) paintSheet(); };
$('next').onclick     = () => { S.date = shiftDate(S.date, 1); render(); if(S.openPid) paintSheet(); };
$('todayBtn').onclick = () => { S.date = currentChartDay(); render(); if(S.openPid) paintSheet(); };
$('signin').onclick   = doSignIn;
$('google').onclick   = doGoogle;
$('forgot').onclick   = doForgot;
$('setpw').onclick    = setNewPassword;
$('np2').addEventListener('keydown', (e) => { if(e.key === 'Enter') setNewPassword(); });
$('pw').addEventListener('keydown', (e) => { if(e.key === 'Enter') doSignIn(); });

document.addEventListener('visibilitychange', () => { if(!document.hidden && S.session) fetchAll(); });

boot();
</script>
</body>
</html>
