# Keeps the free Supabase project from pausing through inactivity.
# Save as .github/workflows/keepalive.yml in the ward repo.
#
# A free project pauses after about a week with no API traffic. This pings it
# every three days, so a quiet stretch on the ward never puts the app to sleep.

name: Supabase keep-alive

on:
  schedule:
    - cron: '17 4 */3 * *'     # every third day, 09:47 IST
  workflow_dispatch:            # also runnable by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Supabase REST endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          echo "HTTP $code"
          # 2xx or 4xx both prove the project is awake and answering.
          # Only a timeout or 5xx means something is actually wrong.
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "Project did not respond properly."
            exit 1
          fi
